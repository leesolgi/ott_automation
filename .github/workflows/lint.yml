name: Lint JS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ESLint 설치
        run: npm install eslint --no-save

      - name: ESLint 기본 설정 생성 (없을 경우)
        run: |
          if [ ! -f .eslintrc.json ]; then
            echo '{
              "env": { "browser": true, "es2021": true },
              "extends": "eslint:recommended",
              "parserOptions": { "ecmaVersion": "latest" },
              "rules": {}
            }' > .eslintrc.json
          fi

      - name: ESLint 실행 (script.js 검사)
        run: npx eslint script.js
